<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#fcfcfb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1a19" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Gastos del mes</title>
<style>
:root {
color-scheme: light;
--surface:#fcfcfb; --card:#fff; --line:#e6e5e0; --grid:#ecebe6;
--ink:#0b0b0b; --ink2:#52514e; --ink3:#85847d;
--s1:#2a78d6; --s2:#eb6834; --prev:#8d8c85; --good:#1a7f4b; --bad:#c4402f;
}
@media (prefers-color-scheme: dark) {
:root {
color-scheme: dark;
--surface:#1a1a19; --card:#232322; --line:#34332f; --grid:#2d2c29;
--ink:#f0efec; --ink2:#c3c2b7; --ink3:#8f8e86;
--s1:#3987e5; --s2:#d95926; --prev:#8f8e86; --good:#4cc28a; --bad:#ef7d6e;
}
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; margin:0; overflow:hidden; overscroll-behavior:none; background:var(--surface); color:var(--ink);
font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
.hidden { display:none !important; }
.num { font-variant-numeric:tabular-nums; }
button { font:inherit; cursor:pointer; }
#lock { height:100dvh; max-width:420px; margin:0 auto; padding:16px; display:flex; flex-direction:column; justify-content:center; gap:14px; }
#lock h1 { margin:0; font-size:22px; } #lock p { margin:0; color:var(--ink2); }
input[type=password] { width:100%; font:inherit; font-size:16px; padding:14px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--ink); }
.btn { padding:14px; border:0; border-radius:12px; background:var(--s1); color:#fff; font-weight:600; }
.check { display:flex; gap:8px; align-items:center; color:var(--ink2); font-size:14px; }
#err { color:var(--bad); min-height:1.2em; font-size:14px; }
#app { height:100dvh; max-width:1280px; margin:0 auto; display:flex; flex-direction:column; gap:8px;
padding:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom)); }
.top { flex:none; display:flex; align-items:center; justify-content:space-between; gap:8px; }
.month { display:flex; align-items:center; gap:4px; }
.month button { width:36px; height:36px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink); font-size:18px; }
.month button:disabled { opacity:.35; }
.month strong { min-width:118px; text-align:center; font-size:16px; }
.seg { display:flex; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:2px; }
.seg button { border:0; background:none; color:var(--ink2); padding:6px 10px; border-radius:8px; font-size:13px; }
.seg button[aria-pressed=true] { background:var(--s1); color:#fff; font-weight:600; }
.grid { flex:1; min-height:0; display:grid; gap:8px; grid-template-columns:minmax(0,1fr);
grid-template-rows:auto minmax(90px,1fr) auto minmax(110px,1.1fr);
grid-template-areas:"hero" "chart" "comp" "lower"; }
.card, .pane { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px 12px; min-height:0; min-width:0; overflow:hidden; display:flex; flex-direction:column; }
.hero{grid-area:hero} .chart{grid-area:chart} .comp{grid-area:comp} .lower{grid-area:lower; padding:8px 12px 10px}
.scroll { flex:1; min-height:0; padding-top:3px; overflow:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; }
h2 { font-size:13px; margin:0 0 6px; font-weight:600; color:var(--ink2); display:flex; justify-content:space-between; align-items:center; gap:8px; }
.label { color:var(--ink2); font-size:12px; }
.hero .big { font-size:32px; font-weight:700; letter-spacing:-.8px; line-height:1.1; }
.delta { font-size:12.5px; color:var(--ink2); margin-top:2px; }
.up { color:var(--bad); font-weight:600; } .down { color:var(--good); font-weight:600; }
.tiles { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:8px; }
.tile { border-top:1px solid var(--line); padding-top:6px; } .tile .v { font-size:15px; font-weight:600; }
.legend { display:flex; flex-wrap:wrap; gap:4px 12px; font-size:11.5px; color:var(--ink2); }
.legend i { display:inline-block; width:16px; height:0; border-top:2.5px solid var(--s1); vertical-align:middle; margin-right:5px; }
.legend i.p { border-top:2px dashed var(--prev); } .legend i.a { border-top:2px dotted var(--s2); }
#chart { position:relative; flex:1; min-height:0; touch-action:pan-y; margin-top:2px; }
#chart svg { position:absolute; inset:0; width:100%; height:100%; }
#tip { position:absolute; top:0; pointer-events:none; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:5px 9px; font-size:12px; box-shadow:0 4px 14px rgba(0,0,0,.18); white-space:nowrap; line-height:1.4; }
.cmp { display:grid; grid-template-columns:1fr auto auto; gap:3px 10px; font-size:13px; align-items:baseline; }
.cmp .h { color:var(--ink3); font-size:11px; }
.cmp .r { text-align:right; }
.cmp .n { color:var(--ink3); font-size:11px; }
.tabs { display:flex; gap:4px; margin-bottom:6px; flex:none; }
.tabs button { flex:1; border:1px solid var(--line); background:none; color:var(--ink2); padding:5px; border-radius:8px; font-size:13px; }
.tabs button[aria-pressed=true] { background:var(--s1); border-color:var(--s1); color:#fff; font-weight:600; }
.pane { display:none; flex:1; border:0; padding:0; background:none; }
.pane.on { display:flex; }
.pane h2 { display:none; }
.cat { display:grid; grid-template-columns:1fr auto; gap:1px 8px; margin-bottom:9px; font-size:13px; }
.cat .a { text-align:right; font-weight:600; }
.cat .a small { font-weight:400; color:var(--ink3); margin-left:4px; }
.cat .vs { grid-column:1 / -1; font-size:11px; color:var(--ink3); margin-top:-1px; }
.bar { grid-column:1 / -1; height:6px; background:var(--grid); border-radius:3px; overflow:hidden; }
.bar span { display:block; height:100%; background:var(--s1); border-radius:0 3px 3px 0; }
.day { color:var(--ink3); font-size:11px; text-transform:uppercase; letter-spacing:.04em; margin:10px 0 2px; }
.day:first-child { margin-top:0; }
.row { display:flex; justify-content:space-between; gap:10px; padding:6px 0; border-bottom:1px solid var(--line); }
.row:last-child { border-bottom:0; }
.row .d { font-size:14px; } .row .c { font-size:11.5px; color:var(--ink3); } .row .m { font-weight:600; white-space:nowrap; font-size:14px; }
.empty { color:var(--ink2); text-align:center; padding:18px 0; }
.foot { flex:none; color:var(--ink3); font-size:11px; text-align:center; }
.foot button { background:none; border:0; color:var(--s1); font-size:11px; padding:2px 6px; }
.views { flex:none; display:flex; } .views .seg { width:100%; } .views .seg button { flex:1; font-size:14px; padding:7px 10px; }
.sag { flex:1; min-height:0; display:flex; flex-direction:column; gap:8px; }
.sag .catsCard { flex:1; }
.sag .hero .big { font-size:36px; }
#hist .top { flex-wrap:wrap; }
.hscroll { flex:1; min-height:120px; overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; }
.hscroll svg { display:block; }
.sagChart { flex:1.2; min-height:170px; }
#sag .catsCard { flex:1; min-height:110px; }
.sagChart .seg button { padding:3px 9px; font-size:12px; }
.hbody { flex:1; min-height:0; display:flex; flex-direction:column; gap:8px; }
.hbody .hscroll { flex:1.2; }
.hside { flex:1; min-height:90px; display:flex; flex-direction:column; border-top:1px solid var(--line); padding-top:6px; }
.hside .row .c b { color:var(--ink2); font-weight:600; }
@media (min-width:900px) {
#hist { max-width:1100px; }
.hbody { flex-direction:row; gap:12px; }
.hbody .hscroll { flex:1; min-width:0; }
.hside { flex:0 0 38%; min-height:0; border-top:0; border-left:1px solid var(--line); padding:0 0 0 12px; }
}
.chips { display:flex; flex-wrap:wrap; gap:6px; max-height:92px; overflow:auto; -webkit-overflow-scrolling:touch; }
.chips button { border:1px solid var(--line); background:none; color:var(--ink2); padding:4px 10px; border-radius:999px; font-size:12.5px; }
.chips button[aria-pressed=true] { background:var(--s1); border-color:var(--s1); color:#fff; font-weight:600; }
h2 .lnk { background:none; border:0; color:var(--s1); font-size:12px; padding:0 2px; }
@media (min-width:900px) {
.views, .sag { width:100%; max-width:720px; margin-left:auto; margin-right:auto; }
#app { padding:14px; gap:10px; } .grid { gap:10px; }
.grid { grid-template-columns:minmax(300px,.9fr) minmax(0,1.1fr) minmax(0,1.1fr); grid-template-rows:minmax(0,1fr) minmax(0,1fr);
grid-template-areas:"hero chart chart" "comp cats list"; }
.lower { display:contents; }
.tabs { display:none; }
.pane { display:flex; border:1px solid var(--line); background:var(--card); padding:10px 12px; }
.pane.cats { grid-area:cats; } .pane.list { grid-area:list; }
.pane h2 { display:flex; }
.hero .big { font-size:40px; }
}
</style>
</head>
<body>
<form id="lock" autocomplete="on">
<h1>Gastos del mes</h1>
<p>Introduce la contraseña para ver los datos.</p>
<input type="text" name="username" value="gastos" autocomplete="username" hidden>
<input id="pw" type="password" autocomplete="current-password" placeholder="Contraseña" required>
<label class="check"><input id="remember" type="checkbox" checked> Recordar en este dispositivo</label>
<div id="err" role="alert"></div>
<button class="btn" type="submit">Entrar</button>
</form>
<main id="app" class="hidden">
<div class="views" id="views"><div class="seg" role="group" aria-label="Vista">
<button data-v="gastos" aria-pressed="true">Gastos</button>
<button data-v="hist" aria-pressed="false">Categorías</button>
<button data-v="sagunto" id="vSag" class="hidden" aria-pressed="false">Sagunto</button>
</div></div>
<div class="top">
<div class="month">
<button id="prev" aria-label="Mes anterior">‹</button>
<strong id="monthName"></strong>
<button id="next" aria-label="Mes siguiente">›</button>
</div>
<div class="seg" id="who" role="group" aria-label="Persona"></div>
</div>
<div class="grid">
<section class="card hero">
<div class="label" id="heroLabel"></div>
<div class="big num" id="hero"></div>
<div class="delta" id="delta"></div>
<div class="tiles">
<div class="tile"><div class="label">Media diaria</div><div class="v num" id="tAvg"></div></div>
<div class="tile"><div class="label" id="tPaidL">Has pagado</div><div class="v num" id="tPaid"></div></div>
<div class="tile"><div class="label" id="tFcL">Previsión</div><div class="v num" id="tFc"></div></div>
</div>
</section>
<section class="card chart">
<h2>Acumulado del mes</h2>
<div class="legend" id="legend"></div>
<div id="chart"></div>
</section>
<section class="card comp">
<h2><span>Comparativa</span><span class="label" id="compCut"></span></h2>
<div class="cmp" id="cmp"></div>
</section>
<div class="card lower">
<div class="tabs" id="tabs">
<button data-t="cats" aria-pressed="true">Categorías</button>
<button data-t="list" aria-pressed="false">Movimientos</button>
</div>
<section class="pane cats on" id="paneCats"><h2>Por categoría <span class="label">vs media 6 meses</span></h2><div class="scroll" id="cats"></div></section>
<section class="pane list" id="paneList"><h2>Movimientos <span class="label" id="count"></span></h2><div class="scroll" id="list"></div></section>
</div>
</div>
<section class="sag hidden" id="hist">
<div class="top">
<div class="seg" id="hWho" role="group" aria-label="Persona"></div>
<div class="seg" id="hGran" role="group" aria-label="Agrupar por">
<button data-g="m" aria-pressed="true">Meses</button>
<button data-g="y" aria-pressed="false">Años</button>
</div>
</div>
<section class="card" style="flex:none">
<h2><span>Categorías <span class="label">(elige una o varias)</span></span><button class="lnk" id="hClear">Todas</button></h2>
<div class="chips" id="hChips"></div>
</section>
<section class="card hero">
<div class="label" id="hLabel"></div>
<div class="big num" id="hHero"></div>
<div class="tiles">
<div class="tile"><div class="label" id="hT1L"></div><div class="v num" id="hT1"></div></div>
<div class="tile"><div class="label">Máximo</div><div class="v num" id="hT2"></div></div>
<div class="tile"><div class="label">Movimientos</div><div class="v num" id="hT3"></div></div>
</div>
</section>
<section class="card catsCard"><h2 id="hTitle"></h2><div class="delta" id="hDetail" style="margin:0 0 4px"></div><div class="hbody"><div class="hscroll" id="hRows"></div><div class="hside"><div class="scroll" id="hList"></div></div></div></section>
</section>
<section class="sag hidden" id="sag">
<div class="top">
<div class="month" id="sMonthBox">
<button id="sPrev" aria-label="Mes anterior">‹</button>
<strong id="sMonthName"></strong>
<button id="sNext" aria-label="Mes siguiente">›</button>
</div>
<div class="seg" id="sPeriod" role="group" aria-label="Periodo">
<button data-p="mes" aria-pressed="true">Mes</button>
<button data-p="total" aria-pressed="false">Total</button>
</div>
</div>
<section class="card hero">
<div class="label" id="sLabel"></div>
<div class="big num" id="sHero"></div>
<div class="delta" id="sDelta"></div>
<div class="tiles">
<div class="tile"><div class="label" id="sT1L"></div><div class="v num" id="sT1"></div></div>
<div class="tile"><div class="label" id="sT2L"></div><div class="v num" id="sT2"></div></div>
<div class="tile"><div class="label">Movimientos</div><div class="v num" id="sT3"></div></div>
</div>
</section>
<section class="card sagChart">
<h2><span>Evolución</span><div class="seg" id="sGran" role="group" aria-label="Agrupar por"><button data-g="m" aria-pressed="true">Meses</button><button data-g="y" aria-pressed="false">Años</button></div></h2>
<div class="delta" id="sDetail" style="margin:0 0 4px"></div>
<div class="hscroll" id="sBars"></div>
</section>
<section class="card catsCard"><h2>Por categoría</h2><div class="scroll" id="sCats"></div></section>
</section>
<div class="foot"><span id="updated"></span> <button id="reload">Recargar</button> <button id="logout">Salir</button></div>
</main>
<script>
const $ = id => document.getElementById(id);
const eur = new Intl.NumberFormat('es-ES', { style:'currency', currency:'EUR' });
const eur0 = new Intl.NumberFormat('es-ES', { style:'currency', currency:'EUR', maximumFractionDigits:0 });
const LS = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const LSset = (k, v) => { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
let DATA = null, months = [], firstMonth = '', tab = LS('tab') || 'cats';
const state = { month:null, who:LS('who') || null };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function descifrar(pw) {
const r = await fetch('data.json?t=' + Date.now(), { cache:'no-store' });
if (!r.ok) throw new Error('No se pudieron cargar los datos');
const j = await r.json();
const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
const key = await crypto.subtle.deriveKey({ name:'PBKDF2', salt:unb64(j.salt), iterations:j.iter, hash:'SHA-256' },
base, { name:'AES-GCM', length:256 }, false, ['decrypt']);
const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv:unb64(j.iv) }, key, unb64(j.ct));
return JSON.parse(new TextDecoder().decode(pt));
}
async function entrar(pw, remember) {
$('err').textContent = '';
try { DATA = await descifrar(pw); }
catch (e) { $('err').textContent = e.message.startsWith('No se') ? e.message : 'Contraseña incorrecta'; LSset('pw', null); return false; }
if (remember) LSset('pw', pw);
iniciar();
return true;
}
const ym = d => d.slice(0, 7);
const importe = t => state.who === 'Total' ? t.total : (t.shares[state.who] || 0);
let GASTOS = [];
const byMonth = {};
function indexar() {
GASTOS = DATA.transactions.filter(t => t.type === 'NORMAL');
for (const k in byMonth) delete byMonth[k];
GASTOS.forEach(t => (byMonth[ym(t.d)] = byMonth[ym(t.d)] || []).push(t));
}
const delMes = m => (byMonth[m] || []).filter(t => importe(t) > 0);
const daysIn = m => { const [y, mo] = m.split('-').map(Number); return new Date(y, mo, 0).getDate(); };
const shiftMonth = (m, n) => { const [y, mo] = m.split('-').map(Number); const d = new Date(y, mo - 1 + n, 1);
return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
const hoyStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
function monthLabel(m) {
const [y, mo] = m.split('-').map(Number);
const n = new Date(y, mo - 1, 1).toLocaleDateString('es-ES', { month:'long' });
return n.charAt(0).toUpperCase() + n.slice(1) + ' ' + y;
}
const mName = m => monthLabel(m).split(' ')[0].toLowerCase();
const sumTo = (m, d, filt) => delMes(m).filter(t => +t.d.slice(8) <= d && (!filt || filt(t))).reduce((s, t) => s + importe(t), 0);
function cumArr(m, len) {  // acumulado por día, índice = día (se extiende con el total)
const a = new Array(len + 1).fill(0);
delMes(m).forEach(t => { const d = +t.d.slice(8); if (d <= len) a[d] += importe(t); else a[len] += importe(t); });
for (let i = 1; i <= len; i++) a[i] += a[i - 1];
return a;
}
function prevMonths(m, n) {  // hasta n meses anteriores con datos disponibles
const out = [];
for (let i = 1; i <= n; i++) { const mm = shiftMonth(m, -i); if (mm < firstMonth) break; out.push(mm); }
return out;
}
const mean = a => a.length ? a.reduce((s, v) => s + v, 0) / a.length : 0;
function iniciar() {
$('lock').classList.add('hidden');
$('app').classList.remove('hidden');
indexar();
const opts = [...DATA.members, 'Total'];
if (!opts.includes(state.who)) state.who = DATA.members[0];
$('who').innerHTML = opts.map(p => `<button data-p="${esc(p)}" aria-pressed="${p === state.who}">${esc(p)}</button>`).join('');
const hm = hoyStr().slice(0, 7);
const set = new Set(GASTOS.map(t => ym(t.d))); set.add(hm);
months = [...set].sort();
firstMonth = months[0];
state.month = hm;
$('updated').textContent = 'Actualizado ' + new Date(DATA.generated).toLocaleString('es-ES', { dateStyle:'short', timeStyle:'short' }) + ' ·';
setTab(tab);
pintar();
iniciarHist();
iniciarSagunto();
}
const hist = { gran:LS('hGran') === 'y' ? 'y' : 'm', cats:new Set() };
const catOf = t => t.cat || 'Sin categoría';
function iniciarHist() {
$('hWho').innerHTML = $('who').innerHTML;
try { hist.cats = new Set(JSON.parse(LS('hCats') || '[]')); } catch (e) { hist.cats = new Set(); }
}
function pintarHist() {
const hm = hoyStr().slice(0, 7), cy = hm.slice(0, 4), yr = hist.gran === 'y';
document.querySelectorAll('#hWho button').forEach(b => b.setAttribute('aria-pressed', b.dataset.p === state.who));
document.querySelectorAll('#hGran button').forEach(b => b.setAttribute('aria-pressed', b.dataset.g === hist.gran));
const base = GASTOS.filter(t => importe(t) > 0);
const totCat = {};
base.forEach(t => totCat[catOf(t)] = (totCat[catOf(t)] || 0) + importe(t));
hist.cats.forEach(c => { if (!(c in totCat)) totCat[c] = 0; });
const names = Object.keys(totCat).sort((a, b) => totCat[b] - totCat[a]);
$('hChips').innerHTML = names.map(n => `<button data-c="${esc(n)}" aria-pressed="${hist.cats.has(n)}">${esc(n)}</button>`).join('');
$('hClear').classList.toggle('hidden', !hist.cats.size);
const sel = base.filter(t => !hist.cats.size || hist.cats.has(catOf(t)));
const key = t => yr ? t.d.slice(0, 4) : ym(t.d);
const by = {};
sel.forEach(t => by[key(t)] = (by[key(t)] || 0) + importe(t));
const last = months[months.length - 1] > hm ? months[months.length - 1] : hm;
let keys = [];
if (yr) { for (let y = +months[0].slice(0, 4); y <= +last.slice(0, 4); y++) keys.push(String(y)); }
else { for (let m = months[0]; m <= last; m = shiftMonth(m, 1)) keys.push(m); }
const fi = keys.findIndex(k => by[k] > 0);
keys = fi < 0 ? [] : keys.slice(fi);
const vals = keys.map(k => by[k] || 0);
const total = vals.reduce((s, v) => s + v, 0);
const lbl = k => yr ? k : monthLabel(k);
const nombre = !hist.cats.size ? 'Todas las categorías' : [...hist.cats].join(' + ');
$('hLabel').textContent = nombre + (state.who === 'Total' ? ' · grupo' : ' · ' + state.who);
$('hHero').textContent = eur.format(total);
$('hT1L').textContent = yr ? 'Media anual' : 'Media mensual';

$('sPrev').onclick = () => { sag.month = sag.months[sag.months.indexOf(sag.month) - 1]; pintarSagunto(); };
$('sNext').onclick = () => { sag.month = sag.months[sag.months.indexOf(sag.month) + 1]; pintarSagunto(); };
$('reload').onclick = () => location.reload();
$('logout').onclick = () => { LSset('pw', null); location.reload(); };
const saved = LS('pw');
if (saved) entrar(saved, true);
</script>
