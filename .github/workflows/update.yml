name: Actualizar gastos

on:
  schedule:
    - cron: "17 */3 * * *"   # cada 3 horas
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Descargar y cifrar
        env:
          TRICOUNT_KEY: ${{ secrets.TRICOUNT_KEY }}
          TRICOUNT_KEY_SAGUNTO: ${{ secrets.TRICOUNT_KEY_SAGUNTO }}
          DASH_PASSWORD: ${{ secrets.DASH_PASSWORD }}
        run: |
          if python fetch_tricount.py transactions.json && { [ -z "$TRICOUNT_KEY_SAGUNTO" ] || python fetch_tricount.py sagunto.json --key-env=TRICOUNT_KEY_SAGUNTO; }; then
            python build.py transactions.json sagunto.json
          else
            # Tricount no responde: se publica igualmente la web con el último data.json ya publicado (sigue cifrado)
            echo "::warning::No se pudo descargar de Tricount; se reutiliza el último data.json publicado"
            mkdir -p site
            curl -fsS https://monikakef.github.io/gastos-dashboard/data.json -o site/data.json
            cp index.html icon.svg icon-192.png icon-512.png apple-touch-icon.png manifest.webmanifest site/
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
